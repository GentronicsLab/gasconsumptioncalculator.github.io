<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Consumption Calculator</title>
    <link rel="stylesheet" type="text/css" href="gasconsumcalc.css">
</head>

<body>
    <h1>Gas Consumption Calculator</h1>
    <form>
        <label for="avg-consumption">Average Consumption (L/100km):</label>
        <input type="number" id="avg-consumption" name="avg-consumption" step="0.1" inputmode="decimal">
        <br>
        <label for="distance">Distance (km):</label>
        <input type="number" id="distance" name="distance" inputmode="decimal">
        <br>
        <label for="gas-price">Gas Price (per liter) €:</label>
        <input type="number" id="gas-price" name="gas-price" step="0.01" inputmode="decimal">
        <br><br>
        <button type="button" onclick="calculateCost()">Calculate Cost</button>
    </form>
    <br>
    <h2>Total Cost: <span id="total-cost"></span></h2>
    
    <div id="flag-icon">
        <a href="gasconsumcalc2.html">
            <img src="Flag_of_Albania.png" alt="Albanian Flag Icon">
        </a>
        <a href="gasconsumcalc3.html">
            <img src="Flag of Sweden.png" alt="Sweden Flag Icon">
        </a>
    </div>

    <script src="gasconsumcalc.js"></script>
</body>

</html>
