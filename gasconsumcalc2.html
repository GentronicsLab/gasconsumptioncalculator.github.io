<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llogarit Koston e Udhetimit per Derivate</title>
    <link rel="stylesheet" type="text/css" href="gasconsumcalc.css">
</head>

<body>
    <h1>Llogarit Koston e Udhetimit per Derivate</h1>
    <form>
        <label for="avg-consumption">Mesatarja e Hargjimit (L/100km):</label>
        <input type="number" id="avg-consumption" name="avg-consumption" step="0.1" inputmode="decimal">
        <br>
        <label for="distance">Distanca (km):</label>
        <input type="number" id="distance" name="distance" inputmode="decimal">
        <br>
        <label for="gas-price">Qmimi i Derivatit (per liter)€:</label>
        <input type="number" id="gas-price" name="gas-price" step="0.01" inputmode="decimal">
        <br><br>
        <button type="button" onclick="calculateCost()">Kalkuloje Koston</button>
    </form>
    <br>
    <h2>Kosto Totale: <span id="total-cost"></span></h2>
    <div id="flag-icon">
        <a href="index.html">
            <img src="Flag_of_the_United_States.png" alt="United States Flag Icon">
        <a href="gasconsumcalc3.html">
            <img src="Flag of Sweden.png" alt="Sweden Flag Icon">
        </a>    
        </a>



        <script src="gasconsumcalc2.js"></script>
</body>

</html>
